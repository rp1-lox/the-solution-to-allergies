<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <title id="t">A sliced rice loaf on a cutting board</title>
  <rect width="480" height="300" rx="24" fill="#f3ead8"/>
  <!-- board -->
  <rect x="50" y="222" width="380" height="30" rx="12" fill="#b9864f"/>
  <rect x="50" y="216" width="380" height="18" rx="9" fill="#d3a46c"/>
  <circle cx="412" cy="225" r="5" fill="#b9864f"/>
  <!-- shadow -->
  <ellipse cx="200" cy="219" rx="118" ry="7" fill="#9c6c3b" opacity=".35"/>
  <!-- loaf -->
  <path d="M84 218 L84 160 Q84 106 150 102 L246 102 Q312 106 312 160 L312 218 Z" fill="#c07a38"/>
  <path d="M96 150 Q100 116 152 112 L244 112 Q296 116 300 150" fill="none" stroke="#dc9b55" stroke-width="10" stroke-linecap="round"/>
  <!-- crack along the top -->
  <path d="M130 118 Q170 104 200 114 T268 116" fill="none" stroke="#8f5622" stroke-width="5" stroke-linecap="round"/>
  <path d="M136 122 Q172 112 200 120 T262 121" fill="none" stroke="#e8c48f" stroke-width="3" stroke-linecap="round"/>
  <!-- slice (back) -->
  <g transform="rotate(14 372 218)">
    <path d="M336 218 L336 152 Q336 124 372 122 Q408 124 408 152 L408 218 Z" fill="#efd9a7" stroke="#b06d2e" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <!-- slice (front) -->
  <g transform="rotate(5 352 218)">
    <path d="M316 218 L316 150 Q316 120 352 118 Q388 120 388 150 L388 218 Z" fill="#f2deb0" stroke="#b8732f" stroke-width="7" stroke-linejoin="round"/>
    <g fill="#dcc08a">
      <ellipse cx="338" cy="150" rx="5" ry="3.5"/><ellipse cx="364" cy="142" rx="4" ry="3"/>
      <ellipse cx="350" cy="172" rx="6" ry="4"/><ellipse cx="372" cy="186" rx="4.5" ry="3"/>
      <ellipse cx="333" cy="196" rx="4" ry="3"/><ellipse cx="360" cy="204" rx="5" ry="3"/>
    </g>
    <g fill="#4d3d33">
      <circle cx="345" cy="136" r="1.6"/><circle cx="372" cy="160" r="1.6"/><circle cx="330" cy="168" r="1.6"/>
      <circle cx="361" cy="178" r="1.6"/><circle cx="342" cy="208" r="1.6"/><circle cx="376" cy="203" r="1.6"/>
      <circle cx="354" cy="155" r="1.6"/>
    </g>
  </g>
  <!-- rice grains -->
  <g fill="#fffaf0" stroke="#d5c6a6" stroke-width="1.5">
    <ellipse cx="74" cy="206" rx="7" ry="3" transform="rotate(-25 74 206)"/>
    <ellipse cx="62" cy="214" rx="7" ry="3" transform="rotate(15 62 214)"/>
    <ellipse cx="420" cy="208" rx="7" ry="3" transform="rotate(30 420 208)"/>
    <ellipse cx="408" cy="215" rx="7" ry="3" transform="rotate(-10 408 215)"/>
    <ellipse cx="430" cy="196" rx="7" ry="3" transform="rotate(-40 430 196)"/>
  </g>
</svg>
