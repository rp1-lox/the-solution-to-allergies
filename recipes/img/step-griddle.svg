<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-labelledby="t">
  <title id="t">Pancake cooking in a skillet, bubbles on top, ready to flip</title>
  <rect width="240" height="160" rx="18" fill="#f3ead8"/>
  <!-- handle -->
  <path d="M178 96 L220 116" stroke="#3b3b3b" stroke-width="12" stroke-linecap="round"/>
