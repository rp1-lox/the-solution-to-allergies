  <ellipse cx="104" cy="92" rx="50" ry="20" fill="#d99a4c"/>
  <ellipse cx="104" cy="90" rx="44" ry="16" fill="#efd39b"/>
  <g fill="#c9a865">
    <circle cx="86" cy="86" r="3"/><circle cx="104" cy="82" r="2.5"/><circle cx="120" cy="88" r="3"/>
    <circle cx="96" cy="96" r="2.5"/><circle cx="114" cy="98" r="2"/><circle cx="130" cy="92" r="2"/><circle cx="76" cy="94" r="2"/>
