      <ellipse cx="344" cy="190" rx="5" ry="3"/><ellipse cx="372" cy="200" rx="4" ry="3"/>
    </g>
    <g fill="#f0d68a"><ellipse cx="358" cy="140" rx="6" ry="3"/><ellipse cx="336" cy="174" rx="5" ry="3"/><ellipse cx="362" cy="186" rx="6" ry="3"/></g>
  </g>
</svg>
