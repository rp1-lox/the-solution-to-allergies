<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <title id="t">Banana bread loaf with a sliced banana on top, a cut slice, and a whole banana</title>
  <rect width="480" height="300" rx="24" fill="#f3ead8"/>
  <!-- board -->
  <rect x="50" y="222" width="380" height="30" rx="12" fill="#b9864f"/>
  <rect x="50" y="216" width="380" height="18" rx="9" fill="#d3a46c"/>
  <ellipse cx="196" cy="219" rx="116" ry="7" fill="#7d4e22" opacity=".35"/>
  <!-- loaf -->
  <path d="M82 218 L82 158 Q82 106 148 102 L244 102 Q310 106 310 158 L310 218 Z" fill="#9a5a28"/>
  <path d="M94 150 Q98 116 150 112 L242 112 Q294 116 298 150" fill="none" stroke="#b97437" stroke-width="10" stroke-linecap="round"/>
  <!-- banana halves baked on top -->
