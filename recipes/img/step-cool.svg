<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-labelledby="t">
  <title id="t">Whole loaf cooling on a wire rack</title>
  <rect width="240" height="160" rx="18" fill="#f3ead8"/>
  <ellipse cx="120" cy="140" rx="96" ry="6" fill="#d9c9a8"/>
  <!-- loaf -->
  <path d="M54 112 L54 80 Q54 46 120 44 Q186 46 186 80 L186 112 Z" fill="#c07a38"/>
  <path d="M66 78 Q70 56 120 54 Q170 56 174 78" fill="none" stroke="#dc9b55" stroke-width="7" stroke-linecap="round"/>
  <path d="M84 60 Q108 50 124 56 T164 58" fill="none" stroke="#8f5622" stroke-width="4" stroke-linecap="round"/>
  <!-- rack -->
  <rect x="26" y="112" width="188" height="6" rx="3" fill="#8b949c"/>
  <g stroke="#8b949c" stroke-width="3">
    <line x1="40" y1="118" x2="40" y2="132"/><line x1="200" y1="118" x2="200" y2="132"/>
  </g>
  <g stroke="#aab2b9" stroke-width="2">
    <line x1="46" y1="112" x2="46" y2="118"/><line x1="70" y1="112" x2="70" y2="118"/><line x1="94" y1="112" x2="94" y2="118"/>
    <line x1="118" y1="112" x2="118" y2="118"/><line x1="142" y1="112" x2="142" y2="118"/><line x1="166" y1="112" x2="166" y2="118"/><line x1="190" y1="112" x2="190" y2="118"/>
  </g>
  <!-- rising heat -->
  <g fill="none" stroke="#cdb994" stroke-width="3.5" stroke-linecap="round">
    <path d="M96 38 q-5 -7 0 -14 q5 -7 0 -12"/><path d="M120 34 q-5 -7 0 -14 q5 -7 0 -10"/><path d="M144 38 q-5 -7 0 -14 q5 -7 0 -12"/>
  </g>
</svg>
