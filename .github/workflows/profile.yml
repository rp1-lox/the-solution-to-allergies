name: Build allergy profile

on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/build-profile.js']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-profile.js
      - name: Commit if changed
        run: |
          git diff --quiet PROFILE.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add PROFILE.md
          git commit -m "Rebuild allergy profile"
          git pull --rebase origin main
          git push origin HEAD:main
